<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛집지도 | ERICA 맛집지도</title>

  <!-- 네이버 지도 API: YOUR_CLIENT_ID 자리에 발급받은 Client ID를 넣으세요 -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=YOUR_CLIENT_ID&submodules=geocoder"></script>

  <!-- 디자인은 style.css를 사용합니다 -->
  <link rel="stylesheet" href="style.css">

  <!-- 상단 메뉴: 첫 페이지, 메뉴 페이지와 같은 모양 -->
  <style>
    .nav {
      background: #0e4a84;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }
    .nav a { color: inherit; text-decoration: none; opacity: 0.8; }
    .nav .logo { font-weight: 800; font-size: 1.1rem; opacity: 1; }
    .nav ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; }
    .nav a:hover, .nav a.active { opacity: 1; font-weight: 700; }
    @media (max-width: 600px) {
      .nav { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <!-- 상단 메뉴 -->
  <nav class="nav">
    <a href="index.html" class="logo">ERICA 맛집지도</a>
    <ul>
      <li><a href="index.html">홈</a></li>
      <li><a href="map.html" class="active">맛집지도</a></li>
      <li><a href="menu.html">메뉴</a></li>
    </ul>
  </nav>

  <main>
    <nav id="filters" class="filters" aria-label="음식 종류"></nav>

    <div class="layout">
      <section class="map-wrap">
        <div id="map"></div>
        <p id="map-notice" class="map-notice" hidden></p>
      </section>

      <section>
        <h2 class="list-title">맛집 목록 <span id="count"></span></h2>
        <ul id="list" class="list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>오픈소스개발과 활용 · 한양대학교 ERICA</p>
  </footer>

  <!-- 맛집 정보는 data.js 한 곳에서 관리합니다 -->
  <script src="data.js"></script>
  <script>
    // 지도와 목록을 화면에 그리는 코드

    const CAMPUS = { lat: 37.2969, lng: 126.8353 }; // ERICA 캠퍼스 부근
    const hasNaver = typeof naver !== "undefined" && naver.maps;

    let map = null;
    let infoWindow = null;
    let currentCategory = "전체";
    const markers = []; // RESTAURANTS와 같은 순서로 마커를 보관

    const listEl = document.getElementById("list");
    const filtersEl = document.getElementById("filters");
    const countEl = document.getElementById("count");
    const noticeEl = document.getElementById("map-notice");

    function showNotice(message) {
      noticeEl.textContent = message;
      noticeEl.hidden = false;
    }

    // Client ID가 틀렸거나 등록되지 않은 주소에서 열었을 때 호출됩니다.
    window.navermap_authFailure = function () {
      showNotice("네이버 지도 인증에 실패했습니다. Client ID와 등록한 웹 서비스 URL을 확인해 주세요.");
    };

    function naverSearchUrl(r) {
      return "https://map.naver.com/p/search/" + encodeURIComponent(r.name);
    }

    // ---------- 목록 ----------
    function renderFilters() {
      const categories = ["전체", ...new Set(RESTAURANTS.map((r) => r.category))];
      filtersEl.innerHTML = "";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cat;
        if (cat === currentCategory) btn.classList.add("active");
        btn.addEventListener("click", () => {
          currentCategory = cat;
          renderFilters();
          renderList();
          updateMarkers();
        });
