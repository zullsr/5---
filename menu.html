<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 | ERICA 맛집지도</title>
  <style>
    :root {
      --main: #0e4a84;
      --accent: #ff7a3d;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --sub: #6b7785;
      --line: #e3e7ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* 상단 메뉴 */
    .nav {
      background: var(--main);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }
    .nav .logo { font-weight: 800; font-size: 1.1rem; }
    .nav ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; }
    .nav a { opacity: 0.8; }
    .nav a:hover, .nav a.active { opacity: 1; font-weight: 700; }

    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .desc { color: var(--sub); margin: 0 0 20px; }

    /* 검색창, 종류 버튼 */
    .tools { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    #search {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .filters button.active { background: var(--main); border-color: var(--main); color: #fff; }

    /* 메뉴 카드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .badge {
      display: inline-block;
      padding: 1px 9px;
      border-radius: 999px;
      background: #fff1ea;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .menus { display: flex; flex-wrap: wrap; gap: 6px; }
    .menus span {
      background: #eef4fb;
      color: var(--main);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
