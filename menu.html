<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 | ERICA 맛집지도</title>
  <style>
    :root {
      --main: #0e4a84;
      --accent: #ff7a3d;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --sub: #6b7785;
      --line: #e3e7ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* 상단 메뉴 */
    .nav {
      background: var(--main);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }
    .nav .logo { font-weight: 800; font-size: 1.1rem; }
    .nav ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; }
    .nav a { opacity: 0.8; }
    .nav a:hover, .nav a.active { opacity: 1; font-weight: 700; }

    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .desc { color: var(--sub); margin: 0 0 20px; }

    /* 검색창, 종류 버튼 */
    .tools { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    #search {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .filters button.active { background: var(--main); border-color: var(--main); color: #fff; }

    /* 메뉴 카드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .badge {
      display: inline-block;
      padding: 1px 9px;
      border-radius: 999px;
      background: #fff1ea;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .menus { display: flex; flex-wrap: wrap; gap: 6px; }
    .menus span {
      background: #eef4fb;
      color: var(--main);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .card p { margin: 0; font-size: 0.92rem; }
    .meta { color: var(--sub); font-size: 0.83rem !important; }

    .empty { color: var(--sub); text-align: center; padding: 40px 0; }

    footer { text-align: center; color: var(--sub); font-size: 0.85rem; padding: 30px 16px; }

    @media (max-width: 600px) {
      .nav { flex-direction: column; gap: 8px; }
    }
  </style>
  <!-- 스타일 담당이 만든 디자인 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 메뉴 -->
  <nav class="nav">
    <a href="index.html" class="logo">ERICA 맛집지도</a>
    <ul>
      <li><a href="index.html">홈</a></li>
      <li><a href="menu.html" class="active">메뉴</a></li>
    </ul>
  </nav>

  <main>
    <h1>메뉴</h1>
    <p class="desc">가게별 대표 메뉴를 모아 봤습니다. 가게 이름이나 메뉴로 검색해 보세요.</p>

    <div class="tools">
      <input type="search" id="search" placeholder="예: 라멘, 돈카츠, 삼계탕">
      <div class="filters" id="filters"></div>
    </div>

    <div class="grid" id="list"></div>
    <p class="empty" id="empty" hidden>찾는 메뉴가 없습니다.</p>
  </main>

  <footer>
    <p>오픈소스개발과 활용 · 한양대학교 ERICA</p>
  </footer>

  <!-- 맛집 정보는 data.js 한 곳에서 관리합니다 -->
  <script src="data.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");

    // 첫 페이지에서 종류를 눌러 들어오면 그 종류부터 보여줍니다. (menu.html?category=한식)
    let currentCategory = new URLSearchParams(location.search).get("category") || "전체";

    function renderFilters() {
      const categories = ["전체", ...new Set(RESTAURANTS.map((r) => r.category))];
      filtersEl.innerHTML = "";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.textContent = cat;
        if (cat === currentCategory) btn.classList.add("active");
        btn.addEventListener("click", () => {
          currentCategory = cat;
          renderFilters();
          renderList();
        });
        filtersEl.appendChild(btn);
      });
    }

    function renderList() {
      const keyword = searchEl.value.trim();
      listEl.innerHTML = "";

      const shown = RESTAURANTS.filter((r) => {
        const okCategory = currentCategory === "전체" || r.category === currentCategory;
        const okKeyword = keyword === "" || (r.name + r.menu).includes(keyword);
        return okCategory && okKeyword;
      });

      shown.forEach((r) => {
        const menuTags = r.menu.split(",").map((m) => "<span>" + m.trim() + "</span>").join("");
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          "<div><span class='badge'>" + r.category + "</span></div>" +
          "<h2>" + r.name + "</h2>" +
          "<div class='menus'>" + menuTags + "</div>" +
          "<p>" + r.comment + "</p>" +
          "<p class='meta'>" + r.address + "</p>";
        listEl.appendChild(card);
      });

      emptyEl.hidden = shown.length > 0;
    }

    searchEl.addEventListener("input", renderList);
    renderFilters();
    renderList();
  </script>
</body>
</html>
